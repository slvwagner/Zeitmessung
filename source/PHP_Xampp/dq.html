<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Racer Disqualify — Zeitmessung V2</title>
  <style>
    :root{
      --bg:#0e0f12; --panel:#151821; --muted:#8a93a3; --text:#e7e9ee; --accent:#ff6b6b; --ok:#4ade80;
      --border:#262a37; --hover:#1b2030; --warn:#ffc857;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:16px 20px; background:var(--panel); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:10;
    }
    h1{font-size:18px; margin:0}
    .sub{color:var(--muted); font-size:12px}
    main{max-width:980px; margin:20px auto; padding:0 16px}
    .card{
      background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 14px;
      box-shadow:0 8px 24px rgba(0,0,0,.25);
    }
    table{
      width:100%; border-collapse:separate; border-spacing:0;
      overflow:hidden; border-radius:12px; border:1px solid var(--border);
    }
    thead th{
      text-align:left; font-weight:600; color:var(--muted); background:#121521; padding:10px 12px; font-size:12px;
      border-bottom:1px solid var(--border);
    }
    tbody td{
      padding:10px 12px; border-bottom:1px solid var(--border);
    }
    tbody tr:hover{ background:var(--hover); }
    .row-actions{ display:flex; gap:8px; align-items:center; }
    .btn{
      appearance:none; border:1px solid var(--border); background:#1b2030; color:var(--text);
      padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600;
      transition:transform .05s ease, background .15s ease;
    }
    .btn:hover{ background:#22283a }
    .btn:active{ transform:translateY(1px) }
    .btn-danger{ background:#2a1520; border-color:#44212f; color:#ffd6d6; }
    .btn-danger:hover{ background:#3a1a28 }
    .btn-ghost{ background:transparent }
    .grid{
      display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; margin-bottom:10px;
    }
    .toolbar{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .pill{
      font-size:12px; color:#121; background:var(--warn); border-radius:999px; padding:2px 8px; font-weight:700; color:#321;
    }
    .muted{ color:var(--muted) }
    .statusbar{
      margin-top:12px; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12px;
    }
    .badge{
      border:1px solid var(--border); background:#131722; padding:2px 8px; border-radius:999px; font-weight:600; font-size:12px;
    }
    .toast{
      position:fixed; right:12px; bottom:12px; background:#0f151f; border:1px solid var(--border);
      padding:10px 14px; border-radius:12px; color:var(--text); box-shadow:0 8px 30px rgba(0,0,0,.25); display:none;
    }
    .toast.ok{ border-color:#235b38 }
    .toast.err{ border-color:#5b2323 }
    .sr-only{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;}
    .empty{ padding:16px; text-align:center; color:var(--muted) }
    footer{ color:var(--muted); font-size:12px; text-align:center; padding:18px 0; }
    .select-cell{ width:44px }
    .nowrap{ white-space:nowrap }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Racer Disqualify <span class="pill">Live</span></h1>
      <div class="sub">Überholen ist nicht erlaubt — Läufer auf der Strecke können disqualifiziert werden.</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="refreshBtn" title="Liste aktualisieren">Aktualisieren</button>
      <button class="btn btn-danger" id="dqSelectedBtn" title="Markierten Läufer disqualifizieren">Disqualifizieren (Auswahl)</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="grid">
        <div class="muted">Quelle: <code>/open_runs.php</code></div>
        <div class="muted nowrap">Aktualisiert: <span id="updatedAt">–</span></div>
      </div>

      <div class="table-wrap">
        <table id="runsTable" aria-describedby="tableDesc">
          <caption class="sr-only" id="tableDesc">Läufer aktuell auf der Strecke</caption>
          <thead>
            <tr>
              <th class="select-cell">Auswahl</th>
              <th>Startnummer</th>
              <th>Run</th>
              <th>Gestartet (lokal)</th>
              <th>Seit</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody id="runsBody">
            <tr><td colspan="6" class="empty">Lade…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="statusbar">
        <span class="badge">Intervall: 3 s</span>
        <span class="badge">Zeitzone: <span id="tzLabel">…</span></span>
        <span id="info" class="muted"></span>
      </div>
    </div>

    <footer>
      WebUI Gerät: <code id="deviceId">…</code> — Name: <code>RaceControl</code>
    </footer>
  </main>

  <div class="toast" id="toast"></div>

<script>
(function(){
  // --- Config ---
  const CONFIG = {
    OPEN_RUNS_URL: '/open_runs.php',
    INSERT_URL:    '/insert_race.php',
    API_KEY:       '' // optional; if your insert_race.php expects X-API-Key, put it here
  };

  // --- Device identity (stable across reloads) ---
  function ensureDeviceId(){
    const key = 'racecontrol_device_id';
    let id = localStorage.getItem(key);
    if(!id){
      // 16 hex chars
      const arr = new Uint8Array(8);
      crypto.getRandomValues(arr);
      id = Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(key, id);
    }
    return id;
  }
  const DEVICE_ID   = ensureDeviceId();
  const DEVICE_NAME = 'RaceControl';

  // --- Time helpers ---
  function pad(n, w){ return String(n).padStart(w||2,'0'); }
  function formatLocalMs(d){
    // "YYYY-MM-DD HH:MM:SS.mmm" in local time
    const y=d.getFullYear(), m=d.getMonth()+1, da=d.getDate();
    const h=d.getHours(), mi=d.getMinutes(), s=d.getSeconds(), ms=d.getMilliseconds();
    return `${y}-${pad(m)}-${pad(da)} ${pad(h)}:${pad(mi)}:${pad(s)}.${pad(ms,3)}`;
  }
  function tzOffsetHours(){
    // JS returns minutes *behind* UTC; we want +hours like 2 for CEST
    return -Math.round(new Date().getTimezoneOffset() / 60);
  }
  function timeSince(dt){
    const ms = Date.now() - dt.getTime();
    if(!isFinite(ms)) return '–';
    const sec = Math.floor(ms/1000);
    const m = Math.floor(sec/60), s = sec%60;
    const h = Math.floor(m/60), mm = m%60;
    return h>0 ? `${h}h ${mm}m` : `${mm}m ${s}s`;
  }
  function parseDBLocal(dtStr){
    // Try to parse "YYYY-MM-DD HH:MM:SS(.mmm)" as local time
    if(!dtStr) return null;
    const t = dtStr.trim().replace(' ', 'T'); // treat as local when no zone is present
    const d = new Date(t);
    return isNaN(d) ? null : d;
  }

  // --- UI helpers ---
  const $runsBody = document.getElementById('runsBody');
  const $updatedAt= document.getElementById('updatedAt');
  const $tzLabel  = document.getElementById('tzLabel');
  const $toast    = document.getElementById('toast');
  const $info     = document.getElementById('info');
  const $dqSel    = document.getElementById('dqSelectedBtn');
  const $refresh  = document.getElementById('refreshBtn');
  const $deviceId = document.getElementById('deviceId');

  $deviceId.textContent = DEVICE_ID;
  $tzLabel.textContent  = `UTC${tzOffsetHours() >= 0 ? '+' : ''}${tzOffsetHours()}`;

  function showToast(msg, ok=true){
    $toast.textContent = msg;
    $toast.className = 'toast ' + (ok ? 'ok' : 'err');
    $toast.style.display = 'block';
    setTimeout(()=>{ $toast.style.display='none'; }, 2500);
  }

  function setInfo(msg){ $info.textContent = msg || ''; }

  function renderRows(rows){
    if(!rows || rows.length===0){
      $runsBody.innerHTML = `<tr><td colspan="6" class="empty">Keine Läufer auf der Strecke.</td></tr>`;
      return;
    }
    const tz = tzOffsetHours();
    const now = Date.now();
    let html = '';
    for(const r of rows){
      const sn  = r.Startnummer;
      const run = r.run;
      const sAt = r.started_at || '';
      const d   = parseDBLocal(sAt);
      const since = d ? timeSince(d) : '–';
      const startedDisp = d ? formatLocalMs(d).slice(0,19) : sAt; // keep to seconds for display
      const key = `${sn}-${run}`;
      html += `
        <tr data-key="${key}" data-sn="${sn}" data-run="${run}">
          <td class="select-cell"><input type="radio" name="sel" value="${key}" aria-label="Auswählen ${sn} Run ${run}"></td>
          <td><strong>#${sn}</strong></td>
          <td>${run}</td>
          <td class="nowrap">${startedDisp}</td>
          <td>${since}</td>
          <td class="row-actions">
            <button class="btn btn-danger" data-action="dq" data-sn="${sn}" data-run="${run}">Disqualifizieren</button>
          </td>
        </tr>`;
    }
    $runsBody.innerHTML = html;
  }

  // --- Networking ---
  async function fetchOpenRuns(){
    setInfo('Lade…');
    try{
      const url = `${CONFIG.OPEN_RUNS_URL}?limit=50`;
      const res = await fetch(url, {headers:{'Accept':'application/json'}});
      const js  = await res.json().catch(()=>null);
      if(!res.ok || !js || (js.status!=='success' && js.status!=='ok')){
        throw new Error('Fehlerhafte Antwort');
      }
      renderRows(js.data || []);
      $updatedAt.textContent = new Date().toLocaleTimeString('de-CH', {hour12:false});
      setInfo('');
    }catch(e){
      renderRows([]);
      setInfo('Fehler beim Laden.');
    }
  }

  async function postDisqualify(sn, run){
    const payload = {
      Startnummer: Number(sn),
      run: Number(run),
      timestamp_ms: formatLocalMs(new Date()),
      device_id: DEVICE_ID,
      device_name: DEVICE_NAME,
      race_status: 'disqualified',
      timezone_offset: tzOffsetHours()
    };
    const headers = {'Content-Type': 'application/json'};
    if(CONFIG.API_KEY) headers['X-API-Key'] = CONFIG.API_KEY;

    const res = await fetch(CONFIG.INSERT_URL, {
      method:'POST',
      headers,
      body: JSON.stringify(payload)
    });
    const js = await res.json().catch(()=>({status:'error'}));
    if(res.ok && js && (js.status==='success' || js.status==='ok')){
      return js;
    }
    // attach http status for easier debug
    throw new Error(`HTTP ${res.status}`);
  }

  // --- Events ---
  $runsBody.addEventListener('click', async (ev)=>{
    const btn = ev.target.closest('button[data-action="dq"]');
    if(!btn) return;
    const sn  = btn.getAttribute('data-sn');
    const run = btn.getAttribute('data-run');

    const ok = confirm(`Startnummer #${sn}, Run ${run} disqualifizieren?\n\nDieser Vorgang fügt einen 'disqualified'-Event ein.`);
    if(!ok) return;

    btn.disabled = true;
    try{
      const res = await postDisqualify(sn, run);
      showToast(`DQ #${sn} r${run} ✓`, true);
      await fetchOpenRuns(); // refresh list so the DQ disappears
    }catch(e){
      showToast(`Fehler beim Disqualifizieren (#${sn} r${run})`, false);
    }finally{
      btn.disabled = false;
    }
  });

  $dqSel.addEventListener('click', async ()=>{
    const sel = document.querySelector('input[name="sel"]:checked');
    if(!sel){
      showToast('Bitte einen Läufer auswählen.', false);
      return;
    }
    const tr  = sel.closest('tr');
    const sn  = tr.getAttribute('data-sn');
    const run = tr.getAttribute('data-run');

    const ok = confirm(`Startnummer #${sn}, Run ${run} disqualifizieren?`);
    if(!ok) return;

    $dqSel.disabled = true;
    try{
      await postDisqualify(sn, run);
      showToast(`DQ #${sn} r${run} ✓`, true);
      await fetchOpenRuns();
    }catch(e){
      showToast(`Fehler beim Disqualifizieren (#${sn} r${run})`, false);
    }finally{
      $dqSel.disabled = false;
    }
  });

  $refresh.addEventListener('click', fetchOpenRuns);

  // --- Auto refresh ---
  fetchOpenRuns();
  setInterval(fetchOpenRuns, 3000);
})();
</script>
</body>
</html>
