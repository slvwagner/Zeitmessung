<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rennübersicht – Fahrer auf der Strecke</title>
  <style>
    :root {
      --bg: #0f172a;       /* slate-900 */
      --card: #111827;     /* gray-900 */
      --muted: #94a3b8;    /* slate-400 */
      --fg: #e5e7eb;       /* gray-200 */
      --accent: #22d3ee;   /* cyan-400 */
      --good: #22c55e;     /* green-500 */
    }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .container { width: 100%; max-width: 1100px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px 20px 20px 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .title {
      display:flex; align-items:center; gap:14px; margin: 6px 0 14px 0;
    }
    .title h1 { font-size: 22px; margin: 0; letter-spacing: 0.2px; }
    .badge {
      background: rgba(34, 211, 238, 0.15);
      border: 1px solid rgba(34,211,238,0.35);
      color: var(--accent);
      padding: 6px 10px; border-radius: 999px; font-weight: 600; font-size: 14px;
      min-width: 36px; text-align:center;
    }
    .status {
      margin-left: auto; font-size: 12px; color: var(--muted);
      display:flex; align-items:center; gap:8px;
    }
    .dot { width:8px; height:8px; border-radius:50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
    table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 12px; }
    thead th {
      text-align: left; font-weight: 700; font-size: 13px; letter-spacing: 0.3px;
      padding: 12px 14px; color: #cbd5e1; background: rgba(148,163,184,0.08);
      border-bottom: 1px solid rgba(148,163,184,0.15);
    }
    tbody td {
      padding: 12px 14px; font-size: 15px; border-bottom: 1px solid rgba(148,163,184,0.1);
    }
    tbody tr:hover { background: rgba(2,6,23,0.4); }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .time { font-variant-numeric: tabular-nums; color: #c7d2fe; } /* indigo-200 */
    .footer {
      display:flex; align-items:center; justify-content: space-between;
      margin-top: 12px; font-size: 12px; color: var(--muted);
    }
    .pill {
      font-size: 12px; padding: 4px 8px; border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25); color: #cbd5e1;
    }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="title">
        <h1>Fahrer auf der Strecke</h1>
        <div id="countBadge" class="badge">0</div>
        <div class="status"><span class="dot" id="liveDot"></span><span id="statusText">Live</span></div>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:120px">Startnummer</th>
            <th>Name</th>
            <th>Vorname</th>
            <th style="width:160px">Datum</th>
            <th style="width:120px">Startzeit</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- rows injected here -->
        </tbody>
      </table>

      <div class="footer">
        <div>Aktualisiert: <span id="updatedAt">–</span></div>
        <div class="pill hidden" id="fallbackInfo">Fallback: Polling</div>
      </div>
    </div>
  </div>

  <script>
    const TBODY       = document.getElementById('tbody');
    const COUNT_BADGE = document.getElementById('countBadge');
    const UPDATED_AT  = document.getElementById('updatedAt');
    const LIVE_DOT    = document.getElementById('liveDot');
    const STATUS_TXT  = document.getElementById('statusText');
    const FALLBACK    = document.getElementById('fallbackInfo');

    const SSE_URL   = 'ontrack_sse.php';   // adjust path if needed
    const ONCE_URL  = 'ontrack_once.php';  // adjust path if needed
    let pollTimer   = null;

    function renderRows(rows) {
      TBODY.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');

        const tdSN  = document.createElement('td');
        tdSN.className = 'num';
        tdSN.textContent = r.Startnummer;

        const tdN   = document.createElement('td');
        tdN.textContent = r.Name || '';

        const tdV   = document.createElement('td');
        tdV.textContent = r.Vorname || '';

        // Split datetime string into date + time
        let datePart = '', timePart = '';
        if (r.started_at) {
          const d = new Date(r.started_at.replace(' ', 'T'));
          datePart = d.toLocaleDateString('de-DE'); // 06.09.2025
          timePart = d.toLocaleTimeString('de-DE', {
            hour12: false,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }

        const tdDate = document.createElement('td');
        tdDate.textContent = datePart;

        const tdTime = document.createElement('td');
        tdTime.className = 'time';
        tdTime.textContent = timePart;

        tr.appendChild(tdSN);
        tr.appendChild(tdN);
        tr.appendChild(tdV);
        tr.appendChild(tdDate);
        tr.appendChild(tdTime);
        TBODY.appendChild(tr);
      }
      COUNT_BADGE.textContent = rows.length;
      UPDATED_AT.textContent = new Date().toLocaleTimeString('de-DE', {
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function setLiveStatus(ok) {
      if (ok) {
        LIVE_DOT.style.background = 'var(--good)';
        LIVE_DOT.style.boxShadow  = '0 0 8px var(--good)';
        STATUS_TXT.textContent    = 'Live';
      } else {
        LIVE_DOT.style.background = '#f97316'; // orange
        LIVE_DOT.style.boxShadow  = '0 0 8px #f97316';
        STATUS_TXT.textContent    = 'Verbunden…';
      }
    }

    async function fetchOnce() {
      try {
        const r = await fetch(ONCE_URL, {cache: 'no-store'});
        const j = await r.json();
        if (j && j.status === 'success') renderRows(j.data || []);
      } catch (e) {
        // ignore
      }
    }

    function startPolling() {
      FALLBACK.classList.remove('hidden');
      if (pollTimer) clearInterval(pollTimer);
      fetchOnce();
      pollTimer = setInterval(fetchOnce, 1000);
    }

    function startSSE() {
      if (!('EventSource' in window)) {
        startPolling();
        return;
      }
      try {
        FALLBACK.classList.add('hidden');
        const es = new EventSource(SSE_URL);
        setLiveStatus(false);

        es.addEventListener('open', () => setLiveStatus(true));
        es.addEventListener('error', () => {
          setLiveStatus(false);
          setTimeout(() => {
            try { es.close(); } catch {}
            startPolling();
          }, 1500);
        });

        es.addEventListener('update', (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            renderRows(payload.rows || []);
            setLiveStatus(true);
          } catch (e) { /* ignore */ }
        });
      } catch (e) {
        startPolling();
      }
    }

    // Start live updates
    startSSE();
  </script>
</body>
</html>
